name: Publish MCP npm package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify an existing release without publishing again
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish-mcp
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `mcp-v${version}`) {
              throw new Error(`Release tag must match package version: v${version}`);
            }
          '
      - run: npm ci
      - run: npm ci
        working-directory: .
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run
      - name: Publish and verify npm release
        run: node ../../scripts/publish-release.mjs ${{ inputs.verify_only && '--verify-only' || '' }}
