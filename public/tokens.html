<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Inbox · Agent access</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><style>main.tokens{max-width:640px;margin:48px auto;padding:0 20px;display:block}.tokens h1{margin:0 0 8px}.tokens form{display:flex;gap:8px;margin:20px 0}.tokens input{flex:1}.token-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #e3e7f0}.token-new{background:#f0f7ff;border-radius:10px;padding:12px;word-break:break-all;font-family:monospace}</style></head><body><main class="tokens"><p><a href="/">← Back to inbox</a></p><h1>Agent access</h1><p>Tokens let the Project Inbox MCP server read mail and log tasks on this hosted inbox. A token is shown once. Revoke it here if it leaks.</p><form id="create"><input id="name" required maxlength="60" placeholder="Name, for example Claude on my Mac" aria-label="Token name"><button class="primary" type="submit">Create token</button></form><div id="created" hidden></div><div id="error" role="alert" hidden></div><div id="list"></div></main><script src="/tokens.js" defer></script></body></html>
